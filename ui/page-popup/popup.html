<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Legend's Tab</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <h1>Legend's Tab</h1>
  <p id="status"></p>
</header>
<div id="quick">
  <button id="bookmark-current" hidden>★ Lưu video này</button>
  <button id="add-current" hidden></button>
</div>
<form id="lock" hidden>
  <p id="lock-hint"></p>
  <div>
    <input id="pin" type="password" autocomplete="off">
    <button id="lock-submit"></button>
  </div>
  <button id="cancel" type="button" class="link" hidden>Huỷ</button>
  <button id="forgot" type="button" class="link" hidden>Quên mã PIN?</button>
</form>
<section id="rules" hidden>
  <nav id="tabs">
    <label><input type="radio" name="tab" value="fav" checked>★ Yêu thích</label>
    <label><input type="radio" name="tab" value="disguise">Ngụy trang</label>
  </nav>
  <div id="tab-fav">
    <ul id="bookmarks"></ul>
  </div>
  <div id="tab-disguise">
    <table>
      <thead><tr><th>Match</th><th>Tiêu đề ({title} = tiêu đề gốc)</th><th>Favicon</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button id="add">+ Thêm rule</button>
  </div>
  <div id="auto-close">
    <div class="head">
      Tab đang ngụy trang
      <label>
        Tự đóng sau
        <input id="auto-close-minutes" type="number" min="0" step="1" title="Số phút tab không được dùng. 0 = tắt">
        phút không dùng
      </label>
    </div>
    <ul id="open-tabs"></ul>
  </div>
  <template id="open-tab">
    <li>
      <div class="ring">
        <svg class="dial" viewBox="0 0 40 40" aria-hidden="true">
          <circle class="track" cx="20" cy="20" r="17"/>
          <circle class="progress" cx="20" cy="20" r="17" pathLength="100"/>
        </svg>
        <svg class="icon" data-for="active" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon" data-for="idle" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
        <svg class="icon" data-for="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
      </div>
      <button><strong></strong><span></span></button>
      <output></output>
    </li>
  </template>
</section>
<footer>
  <button id="restore" class="link" hidden></button>
  <span id="pin-links">
    <button id="lock-now" class="link"></button>
    <button id="set-pin" class="link"></button>
    <button id="remove-pin" class="link" hidden>Bỏ mã PIN</button>
  </span>
</footer>
<div id="icons" popover>
  <button value="icons/google-docs.ico"><img src="../../icons/google-docs.ico" alt="">Google Docs</button>
  <button value="icons/google-sheets.ico"><img src="../../icons/google-sheets.ico" alt="">Google Sheets</button>
  <button value="icons/duolingo.ico"><img src="../../icons/duolingo.ico" alt="">Duolingo</button>
  <button value="icons/elsa.png"><img src="../../icons/elsa.png" alt="">ELSA Speak</button>
</div>
<script src="../../config.js"></script>
<script src="../../rules.js"></script>
<script src="lock.js"></script>
<script src="popup.js"></script>
</body>
</html>
